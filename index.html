<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreCast | Live Sports</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo">SCORE<span>CAST</span></div>
        <nav>
            <a href="#" class="active" id="nav-live">Live Now</a>
            <a href="#" id="nav-highlights">Highlights</a>
            <a href="#" id="nav-standings">Standings</a>
        </nav>
    </header>

    <main>
        <div id="live-sections">
            <section class="hero-match">
                <div class="hero-background"></div>
                
                <div class="hero-content">
                    <div class="match-badge">
                        <span class="live-dot"></span> <span id="hero-league">UEFA CHAMPIONS LEAGUE</span>
                    </div>
                    
                    <div class="main-scoreboard">
                        <div class="team-block home">
                            <img src="https://crests.football-data.org/86.png" alt="Home Team" class="team-logo">
                            <h1 class="team-name" id="hero-home-name">R. MADRID</h1>
                        </div>

                        <div class="score-center">
                            <div class="timer" id="hero-timer">72:14</div>
                            <div class="score-display">
                                <span id="hero-score-home">2</span>
                                <span class="divider">-</span>
                                <span id="hero-score-away">1</span>
                            </div>
                            <div class="status" id="hero-status">2nd Half</div>
                        </div>

                        <div class="team-block away">
                            <img src="https://crests.football-data.org/65.png" alt="Away Team" class="team-logo">
                            <h1 class="team-name" id="hero-away-name">MAN CITY</h1>
                        </div>
                    </div>
                    
                    <div class="match-events" id="hero-events">
                        <p>⚽ 68' Vinícius Jr. (RMA)</p>
                        <p>🟨 42' Rodri (MCI)</p>
                    </div>
                </div>
            </section>

            <section class="other-matches">
                <h2>Live Now</h2>
                <div class="matches-grid" id="secondary-matches-container">
                    </div>
            </section>
        </div>

        <section id="highlights-section" class="content-section" style="display: none;">
            <div class="section-header">
                <h2>Match Highlights</h2>
            </div>
            <div class="highlights-grid" id="highlights-container">
                </div>
        </section>

        <section id="standings-section" class="content-section" style="display: none;">
            <div class="section-header">
                <h2>League Standings</h2>
            </div>
            <div class="table-container">
                <table class="standings-table">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Team</th>
                            <th>MP</th>
                            <th>W</th>
                            <th>D</th>
                            <th>L</th>
                            <th>GF</th>
                            <th>GA</th>
                            <th>GD</th>
                            <th>Pts</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
